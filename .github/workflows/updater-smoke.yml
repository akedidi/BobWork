name: Updater N to N+1 smoke

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Installed release version N (without v)
        required: true
        type: string
      target_version:
        description: Latest release version N+1 expected from the updater
        required: true
        type: string

permissions:
  contents: read

jobs:
  updater-smoke:
    name: Install N · detect N+1 · verify · restart
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release N
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_VERSION: ${{ inputs.from_version }}
        run: |
          set -euo pipefail
          mkdir -p updater-smoke/from
          gh release download "v${FROM_VERSION}" --pattern '*.dmg' --pattern '*.app.tar.gz' --dir updater-smoke/from

      - name: Install and certify release N
        run: |
          set -euo pipefail
          MOUNT_POINT="$RUNNER_TEMP/bob-work-from-dmg"
          INSTALL_ROOT="$RUNNER_TEMP/bob-work-updater-install"
          mkdir -p "$MOUNT_POINT" "$INSTALL_ROOT"
          DMG="$(find updater-smoke/from -name '*.dmg' -print -quit)"
          ARCHIVE="$(find updater-smoke/from -name '*.app.tar.gz' -print -quit)"
          if [[ -n "$DMG" ]]; then
            hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
            SOURCE_APP="$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' -print -quit)"
          elif [[ -n "$ARCHIVE" ]]; then
            tar -xzf "$ARCHIVE" -C "$MOUNT_POINT"
            SOURCE_APP="$(find "$MOUNT_POINT" -maxdepth 2 -name '*.app' -print -quit)"
          else
            echo "Release N has neither a DMG nor an app updater archive" >&2
            exit 1
          fi
          if [[ -z "$SOURCE_APP" ]]; then
            echo "Bob Work.app was not found in release N" >&2
            exit 1
          fi
          ditto "$SOURCE_APP" "$INSTALL_ROOT/Bob Work.app"
          if [[ -n "$DMG" ]]; then hdiutil detach "$MOUNT_POINT"; fi
          codesign --verify --deep --strict --verbose=2 "$INSTALL_ROOT/Bob Work.app"
          codesign -dr - "$INSTALL_ROOT/Bob Work.app" 2>&1 | tee updater-smoke/from-designated-requirement.txt
          if grep -Eiq '\bcdhash\b' updater-smoke/from-designated-requirement.txt; then
            echo "Release N has an unstable ad-hoc designated requirement" >&2
            exit 1
          fi
          codesign -dv --verbose=4 "$INSTALL_ROOT/Bob Work.app" 2>&1 | sed -n 's/^Authority=//p' | head -1 > updater-smoke/from-signing-authority.txt
          echo "SMOKE_APP=$INSTALL_ROOT/Bob Work.app" >> "$GITHUB_ENV"

      - name: Exercise signed updater and process restart
        env:
          BOB_WORK_UPDATER_SMOKE: '1'
          BOB_WORK_UPDATER_EXPECTED_VERSION: ${{ inputs.target_version }}
          BOB_WORK_UPDATER_SMOKE_FILE: ${{ runner.temp }}/bob-work-updater-events.jsonl
        run: |
          set -euo pipefail
          EXECUTABLE="$SMOKE_APP/Contents/MacOS/bob-work"
          "$EXECUTABLE" > updater-smoke/app.log 2>&1 &
          APP_PID=$!
          echo "$APP_PID" > updater-smoke/initial-pid.txt

          for attempt in $(seq 1 120); do
            if [[ -f "$BOB_WORK_UPDATER_SMOKE_FILE" ]]; then
              cp "$BOB_WORK_UPDATER_SMOKE_FILE" updater-smoke/events.jsonl
              if jq -s -e 'any(.[]; .status == "error")' updater-smoke/events.jsonl >/dev/null; then
                cat updater-smoke/events.jsonl
                exit 1
              fi
              if jq -s -e --arg version "$BOB_WORK_UPDATER_EXPECTED_VERSION" '
                any(.[]; .status == "detected" and .to == $version) and
                any(.[]; .status == "installed" and .version == $version) and
                any(.[]; .status == "current" and .version == $version)
              ' updater-smoke/events.jsonl >/dev/null; then
                cat updater-smoke/events.jsonl
                exit 0
              fi
            fi
            sleep 5
          done
          cat updater-smoke/events.jsonl 2>/dev/null || true
          exit 1

      - name: Verify updated bundle after restart
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$SMOKE_APP"
          codesign -dr - "$SMOKE_APP" 2>&1 | tee updater-smoke/to-designated-requirement.txt
          if grep -Eiq '\bcdhash\b' updater-smoke/to-designated-requirement.txt; then
            echo "Updated app has an unstable ad-hoc designated requirement" >&2
            exit 1
          fi
          codesign -dv --verbose=4 "$SMOKE_APP" 2>&1 | sed -n 's/^Authority=//p' | head -1 > updater-smoke/to-signing-authority.txt
          diff -u updater-smoke/from-signing-authority.txt updater-smoke/to-signing-authority.txt

      - name: Upload updater smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bob-work-updater-smoke-${{ github.run_id }}
          path: updater-smoke/**
          if-no-files-found: error
          retention-days: 90
