[package]
name = "bob-work"
version = "0.1.4"
description = "Bob Work - IBM Bob Desktop Application for macOS"
authors = ["Bob Work Team"]
edition = "2021"

[lib]
name = "bob_work_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["backup", "bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
dirs = "5"
which = "6"
semver = "1"
open = "5"
zip = { version = "2", features = ["deflate"] }
zeroize = "1"
aes-gcm = "0.10"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
sha2 = "0.10"
base64 = "0.22"
url = "2"
dotenvy = "0.15"
keyring = "2"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
tauri-plugin-wdio = { version = "1.3.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["std"] }
objc2-foundation = { version = "0.3", features = ["std", "alloc", "block2", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = "0.3"
libc = "0.2"
core-graphics = "0.25"
[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

# The default Rust development profile keeps full debug symbols, which made
# local Tauri + E2E builds consume more than 10 GB. Line-level symbols remain
# available while keeping the target directory materially smaller.
[profile.dev]
debug = 1

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
