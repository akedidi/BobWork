<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { position: relative; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #pointer {
      position: absolute; left: 14px; top: 12px; width: 72px; height: 72px;
      filter: drop-shadow(0 0 10px rgba(15, 98, 254, 0.45));
      animation: idle 2.4s ease-in-out infinite;
    }
    @keyframes idle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1px); }
    }
    #arrow { position: absolute; left: 0; top: 0; width: 27px; height: 36px; background: white;
      clip-path: polygon(0 0, 100% 70%, 59% 72%, 78% 100%, 62% 100%, 44% 74%, 17% 100%);
      filter: drop-shadow(0 2px 3px #000a); }
    #arrow::after { content: ''; position: absolute; inset: 3px; background: #0f62fe;
      clip-path: polygon(0 0, 100% 70%, 59% 72%, 78% 100%, 62% 100%, 44% 74%, 17% 100%); }
    #label { position: absolute; left: 22px; top: 34px; padding: 3px 8px; color: white; background: #0b3b93;
      border: 1px solid #ffffff66; border-radius: 999px; font-size: 11px; font-weight: 700; }
    #pointer.click::before { content: ''; position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border: 3px solid #78a9ff;
      border-radius: 50%; animation: pulse .55s ease-out; }
    @keyframes pulse { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
    #pointer.retarget #arrow { animation: retarget .22s ease-out; }
    @keyframes retarget {
      0% { transform: scale(1); filter: drop-shadow(0 2px 3px #000a); }
      40% { transform: scale(1.12); filter: drop-shadow(0 0 10px rgba(120, 169, 255, 0.95)); }
      100% { transform: scale(1); filter: drop-shadow(0 2px 3px #000a); }
    }
  </style>
</head>
<body>
  <div id="pointer"><div id="arrow"></div><div id="label">Bob</div></div>
  <script src="/bob-pointer.js"></script>
</body>
</html>
